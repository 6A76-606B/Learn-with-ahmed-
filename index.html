<!--
الإعداد (مرة واحدة) — Firebase Console:
1) Authentication > Sign-in method: فعّل Google و Email/Password.
2) Authentication > Users > Add user: اعمل حساب الأدمن بالإيميل ahmed@gmail.com وكلمة المرور اللي تختارها.
3) (مهم للأمان) Authentication > Settings > User actions: اقفل "Enable create (sign-up)" عشان محدش يعمل حساب بإيميل وباسورد غيرك.
4) Authentication > Settings > Authorized domains: ضيف دومين موقعك.
5) Firestore Database > Rules: حط ده:

rules_version='2';
service cloud.firestore {
  match /databases/{d}/documents {
    function adm(){return request.auth!=null && request.auth.token.email=='ahmed@gmail.com'
      && (request.auth.token.email_verified==true || request.auth.token.firebase.sign_in_provider=='password')}
    function ok(){return request.auth!=null && get(/databases/$(d)/documents/users/$(request.auth.uid)).data.banned==false}
    function run(){return request.resource.data.keys().hasOnly(['uid','name','email','code','out','ok','line','at'])
      && request.resource.data.uid==request.auth.uid
      && request.resource.data.code is string && request.resource.data.code.size()<=20000
      && request.resource.data.out is string && request.resource.data.out.size()<=5000}
    match /users/{u} {
      allow read: if adm() || request.auth.uid==u;
      allow create: if request.auth.uid==u && request.resource.data.banned==false
        && request.resource.data.email==request.auth.token.email
        && request.resource.data.keys().hasOnly(['name','email','photo','banned','at']);
      allow update, delete: if adm();
    }
    match /progress/{u} {
      allow read: if adm() || (request.auth.uid==u && ok());
      allow create, update: if request.auth.uid==u && ok()
        && request.resource.data.keys().hasOnly(['done','quiz','last','at']);
      allow delete: if adm();
    }
    match /live/{u} {
      allow read, delete: if adm();
      allow create, update: if request.auth.uid==u && ok() && run();
    }
    match /runs/{r} {
      allow read, delete: if adm();
      allow create: if ok() && run();
    }
    match /{c}/{i} {
      allow read: if c in ['content','questions','settings'] && (adm() || ok());
      allow write: if adm();
    }
  }
}

const patch=h=>{
 const t=document.createElement('template');t.innerHTML=h;
 const nk=[...t.content.querySelectorAll('[data-keep]')],ok=[...app.querySelectorAll('[data-keep]')];
 if(!nk.length||nk.length!==ok.length||nk.some((n,i)=>n.dataset.keep!==ok[i].dataset.keep))return 0;
 const nl=[...t.content.querySelectorAll('[data-live]')],ol=[...app.querySelectorAll('[data-live]')];
 if(nl.length!==ol.length)return 0;
 const nt=t.content.querySelector('.tabs'),ot=app.querySelector('.tabs');
 if(nt&&ot&&nt.textContent!==ot.textContent)return 0;
 nl.forEach((n,i)=>{if(ol[i].innerHTML!==n.innerHTML)ol[i].innerHTML=n.innerHTML});
 return 1;
};
let lastH='',lastV='';
const render=()=>{
 const h=view(),v=[S.u?.uid,S.me?.banned,S.tab,S.adm,S.err,S.pl,S.am,S.ready,S.tab=='ae'?S.sel:''].join();
 if(h!==lastH||v!==lastV){
  const nv=v!==lastV,full=!(!nv&&patch(h));
  if(full){const y=scrollY;app.innerHTML=h;if(!nv)scrollTo(0,y)}
  lastH=h;lastV=v;fx(nv,full);
 }
 syncIde();
};

  return py});

  g.set('__name__','__main__');
  py.setStdin({stdin:()=>{if(L.length){const v=L.shift();send(v+'\n',2);return v}need=1;return undefined}});
  try{
   await py.loadPackagesFromImports(data.code);
   const t=performance.now();
   await py.runPythonAsync(data.code,{globals:g});

  }catch(e){
   fl();const m=String(e.message||e),i=m.indexOf('  File "<exec>"');

   const ls=[...m.matchAll(/File "<exec>", line (\d+)/g)];
   postMessage({o:(i>0?'Traceback (most recent call last):\n'+m.slice(i):m).trimEnd()+'\n',e:1,done:1,fail:1,line:ls.length?+ls[ls.length-1][1]:0});
  }finally{g.destroy()}
 };
};

const mv=async(col,list,id,d,same)=>{
 const k=list.find(x=>x.id==id);if(!k)return;
 const g=same(k),L=list.filter(x=>same(x)==g),a=L.findIndex(x=>x.id==id),j=a+d;
 if(j<0||j>=L.length)return;
 [L[a],L[j]]=[L[j],L[a]];
 const b=writeBatch(db);let n=0;
 list.forEach((x,i)=>b.update(doc(db,col,(same(x)==g?L[n++]:x).id),{order:i}));
 await b.commit();
};
/* من غير Firebase Storage (مجاني): الصور بتتصغّر وتتحفظ في Firestore، والملفات الكبيرة بلينك Google Drive */
const rdURL=f=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f)});
const shrink=async f=>{
 const u=URL.createObjectURL(f);
 try{
  const im=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=()=>no(new Error('الصورة دي مش بتفتح'));i.src=u});
  let W=im.naturalWidth,H=im.naturalHeight,mx=1600,q=.85,out='';
  for(let k=0;k<12;k++){
   const sc=Math.min(1,mx/Math.max(W,H)),c=document.createElement('canvas');c.width=Math.round(W*sc);c.height=Math.round(H*sc);
   const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
   out=c.toDataURL('image/jpeg',q);if(out.length<850000)return out;
   if(q>.55)q-=.1;else mx=Math.round(mx*.8);
  }
  throw new Error('الصورة كبيرة أوي، جرّب صورة أصغر');
 }finally{URL.revokeObjectURL(u)}
};
const delRuns=async uid=>{
 const s=await getDocs(uid?query(collection(db,'runs'),where('uid','==',uid)):collection(db,'runs'));
 for(let i=0;i<s.docs.length;i+=400){const b=writeBatch(db);s.docs.slice(i,i+400).forEach(d=>b.delete(d.ref));await b.commit()}
 if(uid)await deleteDoc(doc(db,'live',uid));else{const l=await getDocs(collection(db,'live'));const b=writeBatch(db);l.docs.forEach(d=>b.delete(d.ref));await b.commit()}
};

const setTheme=(t,ev)=>{
 const apply=()=>{document.documentElement.dataset.theme=t;try{localStorage.setItem('theme',t)}catch(e){};$('meta[name=theme-color]').content=t=='dark'?'#07090e':'#f4f6fb';if(window._cm)setTimeout(()=>_cm.refresh(),0)};
 if(!document.startViewTransition||RM)return apply();
 const x=ev?.clientX??innerWidth/2,y=ev?.clientY??40,r=Math.hypot(Math.max(x,innerWidth-x),Math.max(y,innerHeight-y));
 document.startViewTransition(apply).ready.then(()=>document.documentElement.animate({clipPath:[`circle(0px at ${x}px ${y}px)`,`circle(${r}px at ${x}px ${y}px)`]},{duration:700,easing:'cubic-bezier(.2,.8,.2,1)',pseudoElement:'::view-transition-new(root)'})).catch(()=>0);
};

   S.done=1;S.prog.quiz={score:s,total:n,pct,best:Math.max(pct,S.prog.quiz?.best||0)};render();saveP({quiz:S.prog.quiz});
   setTimeout(()=>scrollTo({top:document.body.scrollHeight,behavior:'smooth'}),100);
   if(pct>=50)setTimeout(()=>{confetti(innerWidth/2,innerHeight*.6,220);if(pct>=80)setTimeout(()=>confetti(innerWidth*.2,innerHeight*.4,120),300)},500);
  }
  else if(a=='rst'){S.ans={};S.done=0;render()}

  else if(a=='openc'){const l=S.live[id];if(!l)return;try{localStorage.setItem('py-code',l.code)}catch(x){};if(window._cm)_cm.setValue(l.code);S.adm=0;S.tab='e';render()}
  else if(a=='rstp'){if(confirm('تصفّر تقدّم الطالب ده (الدروس والاختبار)؟'))await deleteDoc(doc(db,'progress',id))}

   b.disabled=1;await setDoc(doc(db,'settings','site'),{name:$('#sn_').value.trim()||SD.name,ann:$('#sa_').value.trim(),editor:$('#se_').checked,quiz:$('#sq_').checked,files:$('#sf_').checked,at:serverTimestamp()});
   b.disabled=0;b.textContent='✓ اتحفظ';setTimeout(()=>{b.textContent='💾 حفظ الإعدادات'},1600);
