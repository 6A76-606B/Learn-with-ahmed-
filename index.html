<!--
الإعداد (مرة واحدة) — التفاصيل الكاملة في SETUP.md:
1) Firebase Console: اعمل مشروع + Web app، وانسخ الإعدادات في CFG تحت، وحط إيميلك في ADMIN.
2) Authentication > Google: فعّله، وضيف دومين موقعك في Authorized domains.
3) Firestore Database: اعمل قاعدة بيانات وحط الـ Rules دي (غيّر ahmed@gmail.com لإيميلك في كل مكان بيظهر فيه، وفي ADMIN كمان):

rules_version='2';
service cloud.firestore {
  match /databases/{d}/documents {
    function adm(){return request.auth!=null && request.auth.token.email_verified==true && request.auth.token.email=='ahmed@gmail.com'}
    function ok(){return request.auth!=null && get(/databases/$(d)/documents/users/$(request.auth.uid)).data.banned==false}
    match /users/{u} {
      allow read: if adm() || request.auth.uid==u;
      allow create: if request.auth.uid==u && request.resource.data.banned==false
        && request.resource.data.email==request.auth.token.email
        && request.resource.data.keys().hasOnly(['name','email','photo','banned','at']);
      allow update, delete: if adm();
    }
    match /progress/{u} {
      allow read: if adm() || (request.auth.uid==u && ok());
      allow create, update: if request.auth.uid==u && ok()
        && request.resource.data.keys().hasOnly(['done','quiz','last','at']);
      allow delete: if adm();
    }
    match /{c}/{i} {
      allow read: if c in ['content','questions'] && (adm() || ok());
      allow write: if adm();
    }
  }
}

4) Storage (لرفع الفيديو/الصور/PDF): فعّله وحط:

rules_version='2';
service firebase.storage {
  match /b/{b}/o {
    match /content/{f} {
      allow read: if request.auth!=null;
      allow create, update: if request.auth!=null && request.auth.token.email_verified==true
        && request.auth.token.email=='ahmed@gmail.com'
        && request.resource.size < 2 * 1024 * 1024 * 1024
        && request.resource.contentType.matches('video/.*|image/.*|application/pdf');
      allow delete: if request.auth!=null && request.auth.token.email=='ahmed@gmail.com';
    }
  }
}

لو Storage طلب خطة Blaze، ضيف الفيديوهات برابط يوتيوب Unlisted من نفس اللوحة.
-->

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,GoogleAuthProvider,signInWithPopup,signInWithRedirect,signOut,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import{getStorage,ref,uploadBytesResumable,getDownloadURL,deleteObject}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

const CFG={apiKey:"AIzaSyCrjJoGOBi83YM_ilDdWQS3J68pPsqAoLg",authDomain:"learn-with-ahmed-59b98.firebaseapp.com",projectId:"learn-with-ahmed-59b98",storageBucket:"learn-with-ahmed-59b98.firebasestorage.app",messagingSenderId:"101726829373",appId:"1:101726829373:web:1cf5cbabb3d8b168c66354"};
const ADMIN="ahmed@gmail.com";

const AD=ADMIN.trim().toLowerCase();
const $=s=>document.querySelector(s),app=$('#app');
if(CFG.apiKey.startsWith('YOUR')||AD==='you@gmail.com'){app.innerHTML='<div class=hero><h1>الإعداد ناقص</h1><p class=m>افتح الملف وحط إعدادات Firebase وإيميل الأدمن في أوله (CFG و ADMIN).</p></div>';throw 0}
const fb=initializeApp(CFG),auth=getAuth(fb),db=getFirestore(fb),st=getStorage(fb);
const S={ready:0,u:null,me:null,tab:'v',adm:0,content:[],qs:[],users:[],prog:{},allProg:{},pl:0,ans:{},done:0,cur:null,eq:null,err:''};
const E=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const low=u=>(u?.email||'').toLowerCase(),isA=()=>low(S.u)===AD,notA=u=>low(u)!==AD;
const yt=u=>(String(u||'').match(/(?:youtu\.be\/|v=|embed\/|shorts\/|live\/)([\w-]{11})/)||[])[1];
const tt=u=>(String(u||'').match(/tiktok\.com\/(?:@[\w.-]+\/video|embed\/v2|player\/v1)\/(\d{8,25})/)||[])[1];
const ttShort=u=>/(?:vm|vt)\.tiktok\.com|tiktok\.com\/t\//i.test(u||'');
const safe=u=>/^https?:\/\//i.test(u||'')?u:'';
const ms=i=>i.at?.toMillis?.()??Date.now();
const ord=i=>i.order??ms(i);
const byOrd=(a,b)=>ord(a)-ord(b);
const nOrd=L=>L.length?Math.max(...L.map(ord))+1:0;
const player=i=>{
 const y=yt(i.url),t=tt(i.url),u=safe(i.url),sh=/youtube\.com\/shorts\//i.test(i.url||'');
 return t?`<iframe class=vert src="https://www.tiktok.com/embed/v2/${t}" allow="fullscreen;encrypted-media" allowfullscreen loading=lazy referrerpolicy="strict-origin-when-cross-origin"></iframe>`
 :y?`<iframe${sh?' class=vert':''} src="https://www.youtube-nocookie.com/embed/${y}?rel=0&amp;playsinline=1" allow="accelerometer;encrypted-media;picture-in-picture;fullscreen" allowfullscreen loading=lazy referrerpolicy="strict-origin-when-cross-origin"></iframe>`
 :u?`<video src="${E(u)}" controls playsinline preload=metadata controlsList=nodownload onloadedmetadata="this.classList.toggle('vert',this.videoHeight>this.videoWidth)"></video>`:'<p class=m>رابط الفيديو غير صالح.</p>';
};
const empty='<p class=m>لسه مفيش محتوى هنا.</p>',spin='<div class=hero>⏳</div>';
const tabs=T=>`<div class=tabs data-live>${T.map(([k,t])=>`<button class="${S.tab==k?'on':'s'}" data-a=tab data-id=${k}>${t}</button>`).join('')}</div>`;
const errMsg=x=>({
 'permission-denied':'مفيش صلاحية للوصول. اتأكد إنك نشرت الـ Rules الجديدة (في أول الملف أو SETUP.md) وإن إيميل الأدمن صح.',
 'auth/unauthorized-domain':'دومين الموقع مش مضاف في Firebase ← Authentication ← Settings ← Authorized domains.',
 'auth/network-request-failed':'في مشكلة في الإنترنت، جرّب تاني.',
 'unavailable':'السيرفر مش متاح دلوقتي، جرّب بعد شوية.'
}[x?.code]||x?.message||String(x));
const inApp=/FBAN|FBAV|FB_IAB|Instagram|Line\/|Snapchat|TikTok|MicroMessenger|; wv\)/i.test(navigator.userAgent);

/* التقدّم */
const lessons=()=>S.content.filter(i=>i.type=='video');
const dn=id=>!!S.prog.done?.[id];
const saveP=async d=>{try{await setDoc(doc(db,'progress',S.u.uid),{...d,at:serverTimestamp()},{merge:true})}catch(x){alert('تعذّر حفظ التقدّم: '+errMsg(x))}};

const head=()=>`<header><b dir="ltr">🐍 Learn with Ahmed</b>${isA()?`<button class="y sm" data-a=adm>${S.adm?'الكورس':'⚙️ لوحة التحكم'}</button>`:''}${S.u.photoURL?`<img class=av src="${E(S.u.photoURL)}" referrerpolicy=no-referrer alt="">`:''}<button class="s sm" data-a=out>خروج</button></header>`;

const stu=()=>{
 let h=tabs([['v','🎬 الدروس'],['f','📎 الملفات'],['q','📝 الاختبار'],['e','💻 المحرر']]);
 if(S.tab=='v'){
  const L=lessons(),c=L.find(i=>i.id==S.cur)||L.find(i=>i.id==S.prog.last)||L.find(i=>!dn(i.id))||L[0];
  if(!c)return h+empty;
  const nd=L.filter(i=>dn(i.id)).length,p=Math.round(nd/L.length*100);
  h+=`<div data-keep="${E(c.id+'|'+c.url+'|'+c.title)}"><div class=card><h3 style="margin-bottom:10px">${E(c.title)}</h3>${player(c)}</div></div>`
   +`<div data-live><button class="${dn(c.id)?'s':'y'}" style="width:100%;margin-bottom:10px" data-a=tgl data-id="${E(c.id)}">${dn(c.id)?'✅ الدرس مكتمل (اضغط للإلغاء)':'✓ علّم الدرس كمكتمل'}</button>`
   +`<div class=card><div class=row style="justify-content:space-between"><b>تقدّمك</b><span class=m>${nd} من ${L.length} · ${p}%</span></div><div class=pb><i style="width:${p}%"></i></div></div>`
   +L.map((i,n)=>`<button class="ls ${i.id==c.id?'y':'s'}" data-a=play data-id="${E(i.id)}"><span>${dn(i.id)?'✅':'▶'}</span><span>${n+1}. ${E(i.title)}</span></button>`).join('')+`</div>`;
 }else if(S.tab=='f'){
  const L=S.content.filter(i=>i.type!='video');

/* محرر بايثون بسيط: CodeMirror + Pyodide جوه Web Worker. الـ input بيشتغل بإعادة التشغيل بالقيم المدخلة */
const wk=LOCAL=>{
 const V='314.0.7',BASES=[...[].concat(LOCAL),'https://cdn.jsdelivr.net/pyodide/v'+V+'/full/','https://fastly.jsdelivr.net/pyodide/v'+V+'/full/','https://gcore.jsdelivr.net/pyodide/v'+V+'/full/','https://testingcf.jsdelivr.net/pyodide/v'+V+'/full/','https://unpkg.com/pyodide@'+V+'/'];
 let errs=[],cur='';
 let n=0,live=0;const MAX=100000;
 const send=(t,e)=>{n+=t.length+1;if(n<=MAX)postMessage({o:t,e:e});else if(n-t.length-1<=MAX)postMessage({o:'… الناتج كبير أوي واتقطع',e:1})};
 /* السبب الأساسي للمشكلة: جوه Blob worker بايثون مش بيعرف مكان ملفاته، فلازم نحدد indexURL بنفسنا. وبنجرب أكتر من سيرفر */
 const load=async()=>{
  for(const base of BASES){
   const host=base.split('/')[2];
   try{
    importScripts(base+'pyodide.js');
    return await loadPyodide({indexURL:base,stdout:t=>live&&send(t,0),stderr:t=>{if(live)send(t,1);else cur+=t}});
   }catch(e){errs.push(host+': '+String((e&&e.message)||e).slice(0,160)+(cur?' | '+cur.trim().split('\n').pop().slice(0,120):''));cur=''}
  }
  throw new Error(errs.join('\n'));
 };
 const R=load();
 R.then(()=>{live=1;postMessage({ready:1})},x=>postMessage({o:'تعذّر تحميل بايثون — تأكد من النت وجرّب تاني.\nالتفاصيل:\n'+((x&&x.message)||x),e:1,bad:1}));
 onmessage=async({data})=>{
  n=0;
  let py;try{py=await R}catch(e){return}
  const L=(data.inputs||[]).slice(),g=py.globals.get('dict')();
  let need=0;
  const fl=()=>{try{py.runPython('import sys;sys.stdout.flush();sys.stderr.flush()')}catch(e){}};
  g.set('__name__','__main__');
  py.setStdin({stdin:()=>{if(L.length){const v=L.shift();send(v,2);return v}need=1;return undefined}});
  try{
   await py.loadPackagesFromImports(data.code);
   const t=performance.now();
   await py.runPythonAsync(data.code,{globals:g});
   fl();postMessage({done:1,ms:Math.round(performance.now()-t)});
  }catch(e){
   fl();const m=String(e.message||e),i=m.indexOf('  File "<exec>"');
   if(need&&/EOFError/.test(m)){postMessage({need:1,done:1});return}
   const ls=[...m.matchAll(/File "<exec>", line (\d+)/g)];
   postMessage({o:(i>0?'Traceback (most recent call last):\n'+m.slice(i):m).trimEnd(),e:1,done:1,fail:1,line:ls.length?+ls[ls.length-1][1]:0});
  }finally{g.destroy()}
 };
};

const boot=()=>{

 w.onerror=()=>{failed=1;busy=0;out('تعذّر تحميل بايثون — تأكد من الاتصال بالإنترنت.\n','e');stat()};

 };

  else if(a=='adm'){S.adm=!S.adm;S.tab=S.adm?'ac':'v';render()}
  else if(a=='tab'){S.tab=id;render()}
  else if(a=='play'){S.cur=id;render();scrollTo(0,0);saveP({last:id})}
  else if(a=='tgl'){const v=!dn(id);S.prog.done={...S.prog.done,[id]:v};render();saveP({done:{[id]:v}})}
  else if(a=='ans')S.ans[id]=+b.value;
  else if(a=='chk'){
   const un_=S.qs.filter(q=>S.ans[q.id]===undefined).length;
   if(un_&&!confirm('لسه '+un_+' سؤال من غير إجابة. تصحّح كده؟'))return;
   const n=S.qs.length,s=S.qs.filter(q=>S.ans[q.id]===q.a).length,pct=n?Math.round(s/n*100):0;
   S.done=1;S.prog.quiz={score:s,total:n,pct,best:Math.max(pct,S.prog.quiz?.best||0)};render();saveP({quiz:S.prog.quiz});
  }
  else if(a=='rst'){S.ans={};S.done=0;render()}
  else if(a=='addc'){
   const t=$('#ct').value.trim(),f=$('#cf').files[0],l=$('#cl').value.trim();
   if(!t||!f&&!l)return alert('اكتب العنوان واختار ملف أو حط رابط');
   let type='video';
   if(f){
    type=f.type.startsWith('video/')?'video':f.type.startsWith('image/')?'image':f.type=='application/pdf'?'pdf':'';
    if(!type)return alert('الملف لازم يكون فيديو أو صورة أو PDF');
   }else if(!safe(l))return alert('الرابط لازم يبدأ بـ https://');
   else if(ttShort(l))return alert('ده رابط تيك توك مختصر. افتحه في المتصفح وانسخ الرابط الكامل (اللي فيه /video/ ورقم).');
   else if(/tiktok\.com/i.test(l)&&!tt(l))return alert('رابط تيك توك لازم يكون بالشكل: tiktok.com/@اسم/video/رقم');
   b.disabled=1;let up_;
   try{
    const d={title:t,type,order:nOrd(S.content),at:serverTimestamp()};
    if(f)up_=await upl(f,p=>{const g=$('#pg');if(g)g.textContent='جاري الرفع '+p+'%'});
    if(up_)Object.assign(d,up_);else d.url=l;
    await addDoc(collection(db,'content'),d);
    $('#ct').value=$('#cl').value=$('#cf').value='';
   }catch(x){if(up_)deleteObject(ref(st,up_.path)).catch(()=>0);throw x}
   finally{b.disabled=0;const g=$('#pg');if(g)g.textContent=''}
  }
  else if(a=='ren'){
   const i=S.content.find(x=>x.id==id),t=prompt('العنوان الجديد',i?.title||'');
   if(t&&t.trim())await updateDoc(doc(db,'content',id),{title:t.trim()});
  }
  else if(a=='cu'||a=='cd')await mv('content',S.content,id,a=='cu'?-1:1,i=>i.type=='video');
  else if(a=='qu'||a=='qd')await mv('questions',S.qs,id,a=='qu'?-1:1,()=>0);
  else if(a=='addq'){
   const q=$('#qq').value.trim(),o=[0,1,2,3].map(i=>$('#o'+i).value.trim());
   if(!q||o.some(x=>!x))return alert('كمّل السؤال والأربع اختيارات');
   const ans=+$('#qa').value;
   if(S.eq){await updateDoc(doc(db,'questions',S.eq),{q,o,a:ans});S.eq=null;render()}
   else{
    await addDoc(collection(db,'questions'),{q,o,a:ans,order:nOrd(S.qs),at:serverTimestamp()});
    ['qq','o0','o1','o2','o3'].forEach(i=>$('#'+i).value='');$('#qa').value=0;
   }
  }
  else if(a=='editq'){S.eq=id;render();scrollTo({top:0,behavior:'smooth'})}
  else if(a=='cancelq'){S.eq=null;render()}
  else if(a=='delc'){
   if(!confirm('تحذف المحتوى ده؟'))return;
   const i=S.content.find(x=>x.id==id);
   await deleteDoc(doc(db,'content',id));
   if(i?.path)deleteObject(ref(st,i.path)).catch(()=>0);
  }
  else if(a=='delq'){if(confirm('تحذف السؤال؟')){if(S.eq==id)S.eq=null;await deleteDoc(doc(db,'questions',id))}}
  else if(a=='ban'){
   const u=S.users.find(x=>x.id==id);
   if(confirm(u.banned?'تفك الحظر عن الطالب؟':'تخرّج الطالب ده وتمنعه من الدخول؟'))await updateDoc(doc(db,'users',id),{banned:!u.banned});
  }
 }catch(x){alert('حصل خطأ: '+errMsg(x))}
});

onAuthStateChanged(auth,u=>{
 stop(un);stop(cs);
 Object.assign(S,{ready:1,u,me:null,adm:0,tab:'v',cur:null,eq:null,err:'',content:[],qs:[],users:[],prog:{},allProg:{},pl:0,ans:{},done:0});
 if(!u)return render();
  let wa=0;try{wa=sessionStorage.getItem('adm_try')=='1';sessionStorage.removeItem('adm_try')}catch(_){}
  if(wa){
   if(notA(u)){setTimeout(()=>alert('الحساب ده ('+(u.email||'')+') مش حساب الأدمن. سجّل دخول بحساب الأدمن.'),50);signOut(auth);return}
   S.adm=1;S.tab='ac';
  }
 const r=doc(db,'users',u.uid);
 un.push(onSnapshot(r,s=>{
  if(!s.exists())return setDoc(r,{name:u.displayName||'',email:u.email,photo:u.photoURL||'',banned:false,at:serverTimestamp()}).catch(fail);
  S.me=s.data();S.err='';
  if(S.me.banned){stop(cs);Object.assign(S,{content:[],qs:[],users:[],prog:{},allProg:{},pl:1})}else feed();
  render();
 },fail));
 render();
});
render();
</script>
