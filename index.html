<!--
الإعداد (مرة واحدة) — Firebase Console:
1) Authentication > Sign-in method: فعّل Google و Email/Password.
2) Authentication > Users > Add user: اعمل حساب الأدمن بالإيميل ahmed@gmail.com وكلمة المرور اللي تختارها.
3) (مهم للأمان) Authentication > Settings > User actions: اقفل "Enable create (sign-up)" عشان محدش يعمل حساب بإيميل وباسورد غيرك.
4) Authentication > Settings > Authorized domains: ضيف دومين موقعك.
5) Firestore Database > Rules: حط ده:

rules_version='2';
service cloud.firestore {
  match /databases/{d}/documents {
    function adm(){return request.auth!=null && request.auth.token.email=='ahmed@gmail.com'
      && (request.auth.token.email_verified==true || request.auth.token.firebase.sign_in_provider=='password')}
    function ok(){return request.auth!=null && get(/databases/$(d)/documents/users/$(request.auth.uid)).data.banned==false}
    function run(){return request.resource.data.keys().hasOnly(['uid','name','email','code','out','ok','line','at'])
      && request.resource.data.uid==request.auth.uid
      && request.resource.data.code is string && request.resource.data.code.size()<=20000
      && request.resource.data.out is string && request.resource.data.out.size()<=5000}
    match /users/{u} {
      allow read: if adm() || request.auth.uid==u;
      allow create: if request.auth.uid==u && request.resource.data.banned==false
        && request.resource.data.email==request.auth.token.email
        && request.resource.data.keys().hasOnly(['name','email','photo','banned','at']);
      allow update, delete: if adm();
    }
    match /progress/{u} {
      allow read: if adm() || (request.auth.uid==u && ok());
      allow create, update: if request.auth.uid==u && ok()
        && request.resource.data.keys().hasOnly(['done','quiz','last','at']);
      allow delete: if adm();
    }
    match /live/{u} {
      allow read, delete: if adm();
      allow create, update: if request.auth.uid==u && ok() && run();
    }
    match /runs/{r} {
      allow read, delete: if adm();
      allow create: if ok() && run();
    }
    match /support/{u} {
      allow read: if adm() || (request.auth.uid==u && ok());
      allow create: if adm() || (request.auth.uid==u && ok()
        && request.resource.data.keys().hasOnly(['uid','name','email','photo','last','lastFrom','at','uRead','aRead'])
        && request.resource.data.uid==u && request.resource.data.lastFrom=='u');
      allow update: if adm() || (request.auth.uid==u && ok()
        && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['name','email','photo','last','lastFrom','at','uRead','uTyp','st'])
        && (!request.resource.data.diff(resource.data).affectedKeys().hasAny(['last','lastFrom','at']) || request.resource.data.lastFrom=='u'));
      allow delete: if adm();
      match /msgs/{m} {
        allow read: if adm() || (request.auth.uid==u && ok());
        allow create: if request.resource.data.keys().hasOnly(['from','text','at','img','aud','dur','rid','rtx','rf'])
          && request.resource.data.keys().hasAll(['from','text','at'])
          && ((request.auth.uid==u && ok() && request.resource.data.from=='u') || (adm() && request.resource.data.from=='a'))
          && request.resource.data.text is string && request.resource.data.text.size()<=2000
          && (('img' in request.resource.data) || ('aud' in request.resource.data) || request.resource.data.text.size()>0);
        allow update: if ((request.auth.uid==u && ok() && resource.data.from=='u') || (adm() && resource.data.from=='a')) && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['text','edited','rx']);
        allow delete: if adm() || (request.auth.uid==u && ok() && resource.data.from=='u');
      }
    }
    match /{c}/{i} {
      allow read: if c in ['content','questions','settings'] && (adm() || ok());
      allow write: if adm();
    }
  }
}

   (الأفضل تنسخ ملف firestore.rules الكامل المرفق بدل النسخة المختصرة اللي فوق، لأنه بيتحقق من الصورة والفويس بدقة.)

 --ck:#ff79c6;--cd:#50fa7b;--cs:#f1fa8c;--cn:#bd93f9;--cc:#6272a4;--cb:#8be9fd;--cp:#66d9ef;--cv:#e6edf3;--cv2:#ffb86c;--gut:#4a5363;--sel:#3d7ab855}

 --ck:#c2185b;--cd:#1a7f37;--cs:#a35200;--cn:#6f42c1;--cc:#8a94a6;--cb:#0b6bcb;--cp:#0550ae;--cv:#14202f;--cv2:#b35900;--gut:#a6afbd;--sel:#2f6fb533}

/* سحب الرسالة للرد (زي واتساب): يمين أو شمال */
{
 const TH=56,MAX=72;let g=null,sw=0;
 const rp=id=>{const m=SUP.msgs.find(x=>x.id==id);if(!m)return;if(SUP.act||SUP.rx){SUP.act=null;SUP.rx=null;chatPaint()}SUP.reply={id,f:m.from,tx:msgLab(m)};rpPaint();$('#sup_in')?.focus()};
 const end=ok=>{
  if(!g)return;const{b,id,on}=g;g=null;if(!on)return;sw=Date.now();
  b.style.transition='transform .3s var(--spring)';b.style.transform='';
  setTimeout(()=>{b.style.transition='';b.classList.remove('swp','swl','swr','hit')},300);
  if(ok)rp(id);
 };
 document.addEventListener('pointerdown',e=>{
  if(e.pointerType=='mouse'||!e.isPrimary)return;
  const b=e.target.closest('#sup_m .sb[data-mid]');
  if(!b||e.target.closest('button,a,audio,textarea,input,pre,.cb'))return;
  g={b,id:b.dataset.mid,x:e.clientX,y:e.clientY,on:0,a:0};
 },{passive:true});
 document.addEventListener('pointermove',e=>{
  if(!g)return;
  const dx=e.clientX-g.x,dy=e.clientY-g.y;
  if(!g.on){
   if(Math.abs(dy)>12&&Math.abs(dy)>Math.abs(dx)){g=null;return}
   if(Math.abs(dx)<12||Math.abs(dx)<Math.abs(dy)*1.5)return;
   g.on=1;
  }
  const a=Math.max(0,Math.abs(dx)-12),s=dx<0?-1:1,t=s*Math.min(MAX,a<TH?a:TH+(a-TH)*.3),b=g.b;
  g.a=a;b.style.transform=`translateX(${t}px)`;
  b.style.setProperty('--ax',Math.abs(t)+'px');b.style.setProperty('--p',Math.min(1,a/TH));
  b.classList.add('swp');b.classList.toggle('swl',s<0);b.classList.toggle('swr',s>0);
  const hit=a>=TH;if(hit&&!b.classList.contains('hit'))navigator.vibrate?.(10);b.classList.toggle('hit',hit);
 },{passive:true});
 document.addEventListener('pointerup',()=>end(g&&g.on&&g.a>=TH));
 document.addEventListener('pointercancel',()=>end(0));
 document.addEventListener('click',e=>{if(Date.now()-sw<350){e.stopPropagation();e.preventDefault()}},true);
}
